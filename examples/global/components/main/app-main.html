<div class="center">
  <!-- Register form -->
  <div class="form">
    <input ref type="text" name="name" e-bind="$product['name']" placeholder="Name"> <br>
    <input ref type="number" name="price" e-bind="$product['price']" placeholder="Price"> <br>
  </div>

  <div>
    <h3>Product</h3>

    <label> Name: {{ $product.name | upper }} </label>
    <label> Price: {{ $product.price | currency:'$' }} </label>
  </div>
</div>
