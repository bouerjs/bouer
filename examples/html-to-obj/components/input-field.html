<div class="input-field">
  <label e-text="{{ label }}"> Label Name </label>
  <slot default></slot>
  <small e-show="!isValid && !isFirstRun" e-text="{{ required }}"></small>
</div>
<script>
  let watch;

  this.on('loaded', (evt) => {
    watch = this.bouer.watch('value', (v) => {
      this.data.isFirstRun = false;
      this.data.isValid = !(v === '');
    }, this.data);
  });

  this.on('destroyed', () => {
    if (watch) watch.destroy();
  });

  this.export({
    isFirstRun: true,
    isValid: false,
    required: 'The Field "'+ this.data.label +'" is Required *'
  });
</script>

<style scoped>
  small {
    color: red;
  }
  .input-field {
    margin: 4px 0;
    display: flex;
    flex-direction: column;
  }
</style>
