<!DOCTYPE html>
<html lang="en">

<head>
  <base href="/examples/html-to-obj/" />
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../shared.css">
  <title>Example - Html to JS Object Literal</title>
</head>

<body>
  <div id="app">
    <form class="center" on:submit.prevent="submit" e-form="personForm">
      <input-field --s data="{
        label: 'First Name',
        name: 'firstName',
        $form: $form
      }">
        <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
      </input-field>

      <input-field --s data="{
        label: 'Last Name',
        name: 'lastName',
        $form: $form
      }">
        <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
      </input-field>

      <input-field --s data="{
        label: 'Birthdate',
        name: 'birthdate',
        $form: $form
      }">
        <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
      </input-field>

      <input-field --s data="{
        label: 'E-mail Address',
        name: 'email',
        $form: $form
      }">
        <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
      </input-field>


      <div e-build:array="phones" class="card">
        <div>Phones </div>
        <input-field --s data="{
          label: 'Country Code',
          name: 'code',
          $form: $form
        }">
          <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
        </input-field>

        <input-field --s data="{
          label: 'Phone Number',
          name: 'phoneNumber',
          $form: $form,
        }">
          <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
        </input-field>
      </div>

      <!-- Build an phones property as an array -->
      <!-- Build an identification property as an object -->
      <div e-build="identification" class="card">
        <div>Identification</div>
        <input-field --s data="{
          label: 'Type',
          name: 'type',
          $form: $form
        }">
          <select e-name="{{ name }}" on:change="$form.get(name).validate()">
            <option selected> Choose one options </option>
            <option value="ID"> Id Card </option>
            <option value="PP"> Passport </option>
            <option value="DL"> Driver's License </option>
          </select>
        </input-field>


        <input-field --s data="{
          label: 'Code',
          name: 'code',
          $form: $form
        }">
          <input type="text" e-name="{{ name }}" on:keyup="$form.get(name).validate()" />
        </input-field>
      </div>

      <button type="submit" style="color: #ddd; background-color: #2aba10;"> Submit </button>

      <p id="output"></p>

    </form>
  </div>

  <script src="../../dist/bouer.js"></script>
  <script src="./app.js"></script>
</body>

</html>
